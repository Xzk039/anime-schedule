  // ==================== 简介来源 ====================
  // 简介语言:official=官方中文优先(失败回退机翻) / mt=中文机翻 / ja=日文机翻 / raw=原文
  function targetLang() {
    var d = state.settings.desc;
    if (d === "raw") return null;
    if (d === "ja") return "ja-JP";
    return "zh-CN";
  }
  function proxyBase() {
    var p = state.settings.proxy;
    return p ? String(p).replace(/\/+$/, "") : "";
  }
  function translateDesc(id, text, tgt) {
    tgt = tgt || targetLang();
    if (!text || !tgt) return null;
    var key = id + "|" + tgt;
    if (state.translated[key]) return state.translated[key];
    var q = text.length > 900 ? text.slice(0, 900) : text;
    var url = "https://api.mymemory.translated.net/get?q=" + enc(q) + "&langpair=en|" + tgt;
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (json) {
      var v = json && json.responseData && json.responseData.translatedText;
      if (v && String(v).trim() && String(v).toLowerCase() !== String(q).toLowerCase()) {
        state.translated[key] = String(v).trim();
        render();
      }
    }).catch(function () {});
    return null;
  }

  // ---- 官方中文简介:Bangumi 放送日历(一次请求,建立 标题→中文简介 映射) ----
  var bgmMap = null; // normalized title -> { summary, name_cn }
  function normKey(s) {
    return String(s == null ? "" : s)
      .toLowerCase()
      .replace(/[\s\u3000【】\[\]()（）·・:：;；!！?？~～\-—_,.。、"'"'`《》<>]/g, "");
  }
  function loadBgmCalendar() {
    if (bgmMap) return;
    var base = proxyBase();
    var url = base ? base + "/bgm/calendar" : "https://api.bgm.tv/calendar";
    state.bgmStatus = "loading";
    render();
    fetchTimeout(url, null, 9000).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (list) {
      // 注意:/calendar 只返回 id / 名称 / 封面等,不含简介;
      // 简介需要再用 id 请求 /v0/subjects/{id}
      var map = {};
      (Array.isArray(list) ? list : []).forEach(function (day) {
        var items = (day && day.items) || [];
        items.forEach(function (it) {
          if (!it || !it.id) return;
          var rec = { id: it.id, name: it.name || "", name_cn: it.name_cn || "" };
          [it.name, it.name_cn].forEach(function (n) {
            if (n) map[normKey(n)] = rec;
          });
        });
      });
      bgmMap = map;
      state.bgmStatus = "ok:" + Object.keys(map).length;
      render();
    }).catch(function () {
      bgmMap = {};
      state.bgmStatus = "fail";
      render();
    });
  }
  // 按标题找到 Bangumi 条目 id
  function bgmIdFor(it) {
    if (!bgmMap) return null;
    var keys = [it.tNative, it.title, it.tRomaji, it.tEnglish, it.titleSub];
    for (var i = 0; i < keys.length; i++) {
      if (!keys[i]) continue;
      var hit = bgmMap[normKey(keys[i])];
      if (hit && hit.id) return hit;
    }
    return null;
  }
  // 用 id 取官方中文简介(/v0/subjects/{id} 返回含 summary)
  // 返回:{text,src} 成功 / {fail:true} 失败 / {pending:true} 进行中 / null 未匹配或未开始
  function officialFromBgm(it, allowStart) {
    var hit = bgmIdFor(it);
    if (!hit) return null;
    var key = "bgm|" + hit.id;
    if (state.translated[key] !== undefined) {
      var v = state.translated[key];
      return v ? { text: v, src: "Bangumi" } : { fail: true };
    }
    if (state.descLoading[key]) return { pending: true };
    if (!allowStart) return null;
    state.descLoading[key] = true;
    var base = proxyBase();
    var url = base ? (base + "/bgm/subject?id=" + hit.id) : ("https://api.bgm.tv/v0/subjects/" + hit.id);
    fetchTimeout(url, null, 9000)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        var s = j && j.summary;
        state.translated[key] = s ? String(s).trim() : "";
        delete state.descLoading[key];
        render();
      })
      .catch(function () {
        state.translated[key] = "";
        delete state.descLoading[key];
        render();
      });
    return { pending: true };
  }
  // ---- 官方中文简介:Bilibili 番剧详情(需要代理;按 seasonId 精确获取) ----
  function officialFromBili(it, allowStart) {
    if (!it.seasonId) return null;
    var base = proxyBase();
    if (!base) return null;
    var key = "bili|" + it.seasonId;
    if (state.translated[key] !== undefined) {
      var v = state.translated[key];
      return v ? { text: v, src: "Bilibili" } : { fail: true };
    }
    if (state.descLoading[key]) return { pending: true };
    if (!allowStart) return null;
    state.descLoading[key] = true;
    fetchTimeout(base + "/bili/season?id=" + enc(it.seasonId), null, 9000)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        var s = j && (j.evaluate || j.summary);
        state.translated[key] = s ? String(s).trim() : "";
        delete state.descLoading[key];
        render();
      })
      .catch(function () {
        state.translated[key] = "";
        delete state.descLoading[key];
        render();
      });
    return { pending: true };
  }
  // 统一解析:返回 { text, tag, translating }
  function resolveDesc(it, id, expanded) {
    if (!it.desc) return { text: "", tag: "", translating: false };
    var mode = state.settings.desc;
    if (mode === "raw") return { text: it.desc, tag: "", translating: false };

    if (mode === "official") {
      // 官方中文来源:1) Bilibili 官方简介(需代理) 2) Bangumi 官方中文简介(浏览器可直连)
      // 注意:只有展开时才发起请求,避免整页卡片同时请求
      var bili = officialFromBili(it, expanded);
      if (bili && bili.text) return { text: bili.text, tag: t("offTag") + " · Bilibili", translating: false };
      var bgm = officialFromBgm(it, expanded);
      if (bgm && bgm.text) return { text: bgm.text, tag: t("offTag") + " · Bangumi", translating: false };
      var pending = !!((bgm && bgm.pending) || (bili && bili.pending));
      var failed = !!((bgm && bgm.fail) || (bili && bili.fail));
      if (pending) return { text: it.desc, tag: t("offLoading"), translating: true };
      if (!expanded) {
        // 折叠状态且尚无官方简介:显示原文,不发起任何请求
        var cachedMt = state.translated[id + "|zh-CN"];
        return { text: cachedMt || it.desc, tag: cachedMt ? t("mt") : "", translating: false };
      }
      // 没有官方中文 → 回退机翻(仍比英文原文友好)
      var mt0 = translateDesc(id, it.desc, "zh-CN");
      return {
        text: mt0 || it.desc,
        tag: mt0 ? t("mt") : (failed ? t("offFail") : ""),
        translating: !mt0 && !failed
      };
    }
    var tgt = targetLang();
    var mt = tgt ? (expanded ? translateDesc(id, it.desc, tgt) : state.translated[id + "|" + tgt]) : null;
    return {
      text: mt || it.desc,
      tag: mt ? (mode === "ja" ? t("dJa") : t("mt")) : "",
      translating: !!(expanded && tgt && !mt)
    };
  }

  // ==================== 网络 ====================
  function fetchTimeout(url, opts, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms || 8000);
    opts = opts || {};
    opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (r) { clearTimeout(timer); return r; },
      function (e) { clearTimeout(timer); throw e; });
  }

  function biliTimeline(types) {
    return fetchTimeout("https://api.bilibili.com/pgc/web/timeline?types=" + types, null, 6000)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (json) {
        if (!json || json.code !== 0 || !Array.isArray(json.result)) throw new Error("bili code " + (json && json.code));
        return json.result;
      });
  }

  function biliNormalize(daysArr, kind) {
    var out = [];
    daysArr.forEach(function (day) {
      if (!day || !Array.isArray(day.episodes)) return;
      day.episodes.forEach(function (e) {
        if (!e || !e.season_id || !e.title) return;
        var cover = (e.square_cover || e.cover || "").replace(/^http:\/\//i, "https://");
        var pubTs = e.pub_ts || 0;
        var dayIdx = null, clock = "";
        if (pubTs) {
          var d = new Date((pubTs + 8 * 3600) * 1000);
          dayIdx = (d.getUTCDay() + 6) % 7;
          clock = ("0" + d.getUTCHours()).slice(-2) + ":" + ("0" + d.getUTCMinutes()).slice(-2);
        }
        if (e.pub_time) clock = e.pub_time;
        out.push({
          id: "b" + e.season_id + "-" + (e.episode_id || 0),
          kind: kind,
          tNative: e.title, tRomaji: "", tEnglish: "",
          title: e.title, titleSub: "",
          cover: cover, score: null, studio: "", desc: "",
          genresRaw: [],
          dayIdx: dayIdx, clock: clock, nextEp: null, untilDays: null,
          epText: e.pub_index || "",
          seasonId: e.season_id,
          isToday: day.is_today === 1
        });
      });
    });
    return out;
  }

  function loadBili() {
    return Promise.all([
      biliTimeline(1).then(function (r) { return biliNormalize(r, "ri"); }),
      biliTimeline(4).then(function (r) { return biliNormalize(r, "guo"); })
    ]).then(function (res) {
      var all = res[0].concat(res[1]);
      if (!all.length) throw new Error("empty");
      return { items: all, source: "Bilibili" };
    });
  }

  var ENDPOINT = "https://graphql.anilist.co";
  var QUERY = [
    "query ($origin: CountryCode) {",
    "  Page(page: 1, perPage: 50) {",
    "    media(type: ANIME, status: RELEASING, countryOfOrigin: $origin, format_in: [TV, ONA], sort: POPULARITY_DESC) {",
    "      id siteUrl countryOfOrigin episodes averageScore",
    "      title { romaji native english }",
    "      coverImage { extraLarge large color }",
    "      description",
    "      genres",
    "      studios(isMain: true) { nodes { name } }",
    "      nextAiringEpisode { airingAt timeUntilAiring episode }",
    "    }",
    "  }",
    "}"
  ].join("\n");

  function gql(origin) {
    var endpoint = proxyBase() ? (proxyBase() + "/anilist") : ENDPOINT;
    return fetchTimeout(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query: QUERY, variables: { origin: origin } })
    }, 8000).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (json) {
      if (json.errors || !json.data || !json.data.Page) {
        var m = (json.errors && json.errors[0] && json.errors[0].message) || "unknown";
        throw new Error(m);
      }
      return json.data.Page.media || [];
    });
  }

  function strip(s) {
    if (!s) return "";
    return String(s)
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
      .replace(/<[^>]*>/g, "")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'")
      .replace(/\s+/g, " ").trim();
  }

  function aniNormalize(raw, origin) {
    var out = [];
    raw.forEach(function (m) {
      var next = m.nextAiringEpisode;
      var dayIdx = null, clock = "", nextEp = null, untilDays = null;
      if (next && next.airingAt) {
        var d = new Date(next.airingAt * 1000);
        dayIdx = (d.getDay() + 6) % 7;
        clock = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
        nextEp = next.episode || null;
        untilDays = Math.round((next.timeUntilAiring || 0) / 86400);
      }
      var studio = "";
      if (m.studios && m.studios.nodes && m.studios.nodes.length) studio = m.studios.nodes[0].name;
      var tn = (m.title && m.title.native) || "", tr = (m.title && m.title.romaji) || "", te = (m.title && m.title.english) || "";
      out.push({
        id: "a" + m.id,
        kind: origin === "CN" ? "guo" : "ri",
        tNative: tn, tRomaji: tr, tEnglish: te,
        title: tn || tr || te || "?",
        titleSub: "",
        cover: (m.coverImage && (m.coverImage.extraLarge || m.coverImage.large)) || "",
        score: m.averageScore || null,
        studio: studio,
        desc: strip(m.description),
        genresRaw: (m.genres || []).slice(0, 4),
        siteUrl: m.siteUrl || "https://anilist.co",
        dayIdx: dayIdx, clock: clock, nextEp: nextEp, untilDays: untilDays,
        epText: "", seasonId: null, isToday: false
      });
    });
    return out;
  }

  function loadAni() {
    return Promise.all([gql("JP"), gql("CN")]).then(function (res) {
      var all = aniNormalize(res[0], "JP").concat(aniNormalize(res[1], "CN"));
      if (!all.length) throw new Error("empty");
      return { items: all, source: "AniList" };
    });
  }

  function loadAll() {
    if (state.loading) return;
    state.loading = true;
    setStatus(true, t("loading"), "");
    el.refreshBtn.disabled = true;
    setSrc("", "");
    loadBili().catch(function () { return loadAni(); }).then(function (res) {
      state.items = res.items;
      state.expanded = {};
      state.source = res.source;
      setStatus(false, "", "");
      if (!state.items.length) setStatus(false, t("noData"), "");
      render();
    }).catch(function (err) {
      state.items = [];
      state.source = "";
      setStatus(false, "", t("failTitle") + "<br>" + t("failWhy") + "<br>" + t("failWhat") + esc(err && err.message));
      render();
    }).then(function () {
      state.loading = false;
      el.refreshBtn.disabled = false;
    });
  }

  // ==================== 工具 ====================
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function enc(s) { return encodeURIComponent(String(s)); }

  function displayTitle(it) {
    if (it._snapshot) return { main: it.title, sub: it.titleSub };
    var pref = state.settings.title;
    var n = it.tNative, r = it.tRomaji, e = it.tEnglish;
    var main;
    if (pref === "romaji") main = r || n || e;
    else if (pref === "english") main = e || r || n;
    else main = n || r || e;
    main = main || it.title || "?";
    var pool = [n, r, e].filter(function (x) { return x && x !== main; });
    return { main: main, sub: pool[0] || "" };
  }
  function searchText(it) {
    return [it.tNative, it.tRomaji, it.tEnglish, it.title, it.titleSub].filter(Boolean).join(" ").toLowerCase();
  }
  function mainGenreRaw(it) {
    if (it.genresRaw && it.genresRaw.length) return it.genresRaw[0];
    return "Other";
  }

  // 搜索与正版平台链接(全部为跳转链接)
  function extSearch(title) {
    var q = enc(title);
    return {
      bangumi: "https://bgm.tv/subject_search/" + q + "?cat=2",
      bilibili: "https://search.bilibili.com/all?keyword=" + q,
      anilist: "https://anilist.co/search/anime?search=" + q,
      mal: "https://myanimelist.net/anime.php?q=" + q + "&cat=anime",
      tencent: "https://v.qq.com/x/search/?q=" + q,
      iqiyi: "https://so.iqiyi.com/so/q_" + q,
      youku: "https://so.youku.com/search_video/q_" + q,
      mgtv: "https://so.mgtv.com/so?k=" + q,
      acfun: "https://www.acfun.cn/search?keyword=" + q,
      bahamut: "https://ani.gamer.com.tw/search.php?kw=" + q,
      crunchyroll: "https://www.crunchyroll.com/search?q=" + q,
      netflix: "https://www.netflix.com/search?q=" + q,
      hidive: "https://www.hidive.com/search?q=" + q,
      primevideo: "https://www.primevideo.com/search?phrase=" + q,
      disney: "https://www.disneyplus.com/search?q=" + q
    };
  }
  function platformRow(it) {
    var links = extSearch(it.title);
    var cn = [
      ["Bilibili", links.bilibili], ["Tencent", links.tencent], ["iQIYI", links.iqiyi],
      ["Youku", links.youku], ["Mango TV", links.mgtv], ["AcFun", links.acfun], ["Bahamut", links.bahamut]
    ];
    var intl = [
      ["Crunchyroll", links.crunchyroll], ["Netflix", links.netflix], ["HIDIVE", links.hidive],
      ["Prime Video", links.primevideo], ["Disney+", links.disney]
    ];
    function row(label, arr) {
      return '<div class="ext"><span class="lbl">' + esc(label) + ":</span>" +
        arr.map(function (p) {
          return '<a href="' + esc(p[1]) + '" target="_blank" rel="noreferrer">' + esc(p[0]) + "</a>";
        }).join("") + "</div>";
    }
    return row(t("cn"), cn) + row(t("intl"), intl);
  }

  function setStatus(loading, text, errText) {
    el.status.className = "msg" + (errText ? " err" : "");
    el.status.innerHTML = (loading ? '<span class="loading"></span>' : "") + (errText || text || "");
  }
  function setSrc(source, msg) {
    el.srcRow.innerHTML = source
      ? '<span class="dot"></span>' + esc(t("src")) + esc(source) + (msg ? " · " + esc(msg) : "")
      : "";
  }
  // 官方中文简介(Bangumi)加载状态提示
  function bgmStatusHtml() {
    if (state.settings.desc !== "official") return "";
    var s = state.bgmStatus;
    if (s === "loading") return esc(t("bgmLoading"));
    if (s && s.indexOf("ok:") === 0) return "✅ " + esc(t("bgmOk")) + " " + s.slice(3) + " " + esc(t("bgmUnit"));
    if (s === "fail") return "⚠️ " + esc(t("bgmFail"));
    return "";
  }

  // ==================== 设置面板 ====================
  function segHtml(defs, current) {
    return defs.map(function (d) {
      return '<button data-v="' + d[0] + '" class="' + (current === d[0] ? "on" : "") + '">' + esc(d[1]) + "</button>";
    }).join("");
  }
  function renderSettings() {
    el.setToggle.title = t("setTip");
    el.setPanel.style.display = state.showSettings ? "" : "none";
    el.lblUi.textContent = t("setUi");
    el.lblTitle.textContent = t("setTitle");
    el.lblDesc.textContent = t("setDesc");
    el.lblProxy.textContent = t("setProxy");
    if (document.activeElement !== el.setProxy) el.setProxy.value = state.settings.proxy || "";
    el.setProxy.placeholder = t("proxyPh");
    el.setUi.innerHTML = segHtml([["zh", "中文"], ["en", "English"], ["ja", "日本語"]], state.settings.ui);
    el.setTitle.innerHTML = segHtml([["native", t("tNative")], ["romaji", t("tRomaji")], ["english", t("tEnglish")]], state.settings.title);
    el.setDesc.innerHTML = segHtml([
      ["official", t("dOfficial")], ["mt", t("dMt")], ["raw", t("dRaw")], ["ja", t("dJa")]
    ], state.settings.desc);
    [["ui", el.setUi], ["title", el.setTitle], ["desc", el.setDesc]].forEach(function (pair) {
      var key = pair[0], node = pair[1];
      Array.prototype.forEach.call(node.querySelectorAll("button"), function (b) {
        b.onclick = function () {
          state.settings[key] = b.getAttribute("data-v");
          saveSettings();
          if (key === "ui") applyStaticText();
          if (key === "desc" && state.settings.desc === "official") loadBgmCalendar();
          render();
        };
      });
    });
  }
  function applyStaticText() {
    document.documentElement.lang = state.settings.ui === "zh" ? "zh-CN" : (state.settings.ui === "ja" ? "ja" : "en");
    el.hTitle.textContent = t("title");
    el.hSub.textContent = t("sub");
    el.footNote.textContent = t("foot");
    el.refreshBtn.textContent = t("refresh");
    el.dlWin.textContent = t("dlWin");
    el.dlApk.textContent = t("dlApk");
    el.search.placeholder = t("search");
    updateFavBar();
  }

  // ==================== 渲染 ====================
  function render() {
    applyStaticText();
    renderSettings();

    el.siteChips.innerHTML = SITES.map(function (s) {
      return '<a class="chip" href="' + esc(s.url) + '" target="_blank" rel="noreferrer">' + esc(s.name) + '<small>↗</small></a>';
    }).join("");

    el.segMode.innerHTML = segHtml([["week", t("modeWeek")], ["type", t("modeType")]], state.mode);
    Array.prototype.forEach.call(el.segMode.querySelectorAll("button"), function (b) {
      b.onclick = function () { state.mode = b.getAttribute("data-v"); render(); };
    });
    el.seg.innerHTML = segHtml([["all", t("all")], ["ri", t("ri")], ["guo", t("guo")]], state.filter);
    Array.prototype.forEach.call(el.seg.querySelectorAll("button"), function (b) {
      b.onclick = function () { state.filter = b.getAttribute("data-v"); render(); };
    });

    setSrc(state.source, state.source ? t("srcHint") : "");
    var bsHtml = bgmStatusHtml();
    if (bsHtml) el.srcRow.innerHTML += (el.srcRow.innerHTML ? " &nbsp;·&nbsp; " : "") + bsHtml;

    var q = state.query.toLowerCase();
    function keep(it) {
      if (state.filter === "ri" && it.kind !== "ri") return false;
      if (state.filter === "guo" && it.kind !== "guo") return false;
      if (q && searchText(it).indexOf(q) < 0) return false;
      return true;
    }
    var shown;
    if (state.onlyFav) {
      shown = Object.keys(state.favs).map(function (k) { return favToItem(state.favs[k]); }).filter(keep);
    } else {
      shown = state.items.filter(keep);
    }

    var container = el.list;
    if (!shown.length) {
      container.innerHTML = state.onlyFav
        ? '<div class="msg">' + esc(t("noFav")) + "</div>"
        : (state.items.length ? '<div class="msg">' + esc(t("noMatch")) + "</div>"
          : '<div class="msg">' + esc(t("noData")) + "</div>");
      bindCards();
      return;
    }
    container.innerHTML = (state.mode === "type" && !state.onlyFav) ? renderByType(shown) : renderByWeek(shown);
    bindCards();
  }

  function bindCards() {
    var container = el.list;
    Array.prototype.forEach.call(container.querySelectorAll("[data-expand]"), function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-expand");
        state.expanded[id] = !state.expanded[id];
        render();
      };
    });
    Array.prototype.forEach.call(container.querySelectorAll("[data-fav]"), function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-fav");
        if (state.onlyFav) {
          if (state.favs[id]) { delete state.favs[id]; saveFavs(); render(); }
          return;
        }
        var live = findItemById(id);
        if (live) toggleFav(live);
      };
    });
  }

  function favToItem(f) {
    return {
      id: f.id, _snapshot: true,
      kind: f.kind || "", kindLabel: f.kindLabel || "",
      tNative: f.title || "", tRomaji: "", tEnglish: "",
      title: f.title || "?", titleSub: f.titleSub || "",
      cover: f.cover || "", score: null, studio: "", desc: "", genresRaw: [],
      siteUrl: f.siteUrl || f.watchUrl || "", seasonId: f.seasonId || null,
      dayIdx: null, clock: "", nextEp: null, untilDays: null, epText: ""
    };
  }
  function findItemById(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].seasonId && ("s" + state.items[i].seasonId) === id) return state.items[i];
      if (state.items[i].id === id) return state.items[i];
    }
    return null;
  }

  function renderByWeek(shown) {
    var byDay = {};
    shown.forEach(function (it) {
      var k = it.dayIdx == null ? 7 : it.dayIdx;
      (byDay[k] = byDay[k] || []).push(it);
    });
    var now = new Date();
    var todayIdx = (now.getDay() + 6) % 7;
    var W = weekNames();
    var html = "", count = 0;
    [0, 1, 2, 3, 4, 5, 6, 7].forEach(function (k) {
      var items = byDay[k];
      if (!items) return;
      items.sort(function (a, b) {
        if (a.clock === b.clock) return displayTitle(a).main.localeCompare(displayTitle(b).main);
        return a.clock < b.clock ? -1 : 1;
      });
      var isToday = k === todayIdx;
      count += items.length;
      var label = (k === 7) ? t("ongoing") : W[k];
      html += '<div class="day"><span class="dn' + (isToday ? " today" : "") + '">' +
        (isToday ? esc(t("today")) + " · " : "") + esc(label) + "</span>" +
        '<span class="dm">' + items.length + " " + esc(t("unit")) + "</span></div>";
      items.forEach(function (it) { html += cardHtml(it); });
    });
    var note = state.filter === "all" ? t("mixed") : (state.filter === "ri" ? t("onlyRi") : t("onlyGuo"));
    return '<div style="color:var(--sub);font-size:12.5px;margin-top:4px">' + esc(t("totalPre")) + " " + count + " " +
      esc(t("unit")) + " · " + esc(note) + "</div>" + html;
  }

  function renderByType(shown) {
    var kinds = state.filter === "ri" ? [["ri", t("ri")]]
      : state.filter === "guo" ? [["guo", t("guo")]]
        : [["ri", t("ri")], ["guo", t("guo")]];
    var html = "", total = 0;
    kinds.forEach(function (pair) {
      var kind = pair[0], kindLabel = pair[1];
      var list = shown.filter(function (it) { return it.kind === kind; });
      if (!list.length) return;
      var groups = {};
      list.forEach(function (it) {
        var g = mainGenreRaw(it);
        (groups[g] = groups[g] || []).push(it);
      });
      var keys = Object.keys(groups).sort(function (a, b) {
        var ia = GENRE_ORDER.indexOf(a), ib = GENRE_ORDER.indexOf(b);
        if (ia === -1) ia = 999;
        if (ib === -1) ib = 999;
        return ia - ib;
      });
      html += '<div class="sect"><span>' + esc(kindLabel) + '</span><span class="scount">' + list.length + " " + esc(t("unit")) + "</span></div>";
      keys.forEach(function (g) {
        var items = groups[g].sort(function (a, b) {
          var ka = a.dayIdx == null ? 7 : a.dayIdx, kb = b.dayIdx == null ? 7 : b.dayIdx;
          if (ka !== kb) return ka - kb;
          if (a.clock === b.clock) return displayTitle(a).main.localeCompare(displayTitle(b).main);
          return a.clock < b.clock ? -1 : 1;
        });
        total += items.length;
        html += '<div class="grp"><span>' + esc(genreLabel(g)) + '</span><span class="gcount">' + items.length + " " + esc(t("unit")) + "</span></div>";
        items.forEach(function (it) { html += cardHtml(it); });
      });
    });
    return '<div style="color:var(--sub);font-size:12.5px;margin-top:4px">' + esc(t("totalPre")) + " " + total + " " +
      esc(t("unit")) + " · " + esc(t("splitNote")) + "</div>" + html;
  }

  function metaHtml(it) {
    if (it._snapshot) return esc(t("snap"));
    var W = weekNames();
    if (it.dayIdx != null && (it.clock || it.nextEp)) {
      var parts = [esc(t("est")) + ' <b>' + esc(W[it.dayIdx]) + (it.clock ? " " + esc(it.clock) : "") + "</b>"];
      if (it.nextEp) parts.push(esc(t("epN")) + " <b>" + it.nextEp + "</b> " + esc(t("epUnit")));
      if (it.untilDays != null && it.untilDays >= 0) {
        parts.push(it.untilDays === 0 ? " · " + esc(t("justToday")) : " · " + esc(t("inDays")) + " " + (it.untilDays + 1) + " " + esc(t("daysLater")));
      }
      return parts.join("");
    }
    if (it.epText) return esc(t("upd")) + " " + esc(it.epText);
    return esc(t("ongoing"));
  }

  function cardHtml(it) {
    var id = it.id;
    var favKey = favId(it);
    var isFav = !!state.favs[favKey];
    var expanded = !!state.expanded[id];
    var dt = displayTitle(it);
    var kindLabel = it.kind === "guo" ? t("guo") : (it.kind === "ri" ? t("ri") : (it.kindLabel || ""));
    var tags = ['<span class="tag ' + it.kind + '">' + esc(kindLabel) + "</span>"];
    if (isFav) tags.push('<span class="tag now">★' + esc(t("faved")) + "</span>");
    if (it.score) tags.push('<span class="tag">' + esc(t("score")) + " " + it.score + "</span>");
    if (it.studio) tags.push('<span class="tag">' + esc(it.studio) + "</span>");
    (it.genresRaw || []).slice(0, 3).forEach(function (g) {
      tags.push('<span class="tag">' + esc(genreLabel(g)) + "</span>");
    });
    if (it.epText) tags.push('<span class="tag">' + esc(it.epText) + "</span>");

    var links = extSearch(it.title);
    var watchLink = it.seasonId
      ? "https://www.bilibili.com/bangumi/play/ss" + it.seasonId
      : (it.siteUrl || "https://anilist.co");

    var detail = "";
    if (it.desc) {
      var R = resolveDesc(it, id, expanded);
      var mtTag = R.tag ? '<span class="tag now">' + esc(R.tag) + "</span>" : "";
      var translating = R.translating ? '<span class="tag">' + esc(t("mtLoading")) + "</span>" : "";
      detail = '<div class="desc' + (expanded ? "" : " clamp") + '">' + esc(R.text) + "</div>" +
        '<div class="ext"><button data-expand="' + id + '">' + esc(expanded ? t("collapse") : t("expand")) + "</button>" +
        mtTag + translating +
        (it.siteUrl ? '<a href="' + esc(it.siteUrl) + '" target="_blank" rel="noreferrer">' + esc(t("origin")) + " ↗</a>" : "") +
        '<a href="' + esc(links.bangumi) + '" target="_blank" rel="noreferrer">Bangumi ↗</a>' +
        "</div>" + platformRow(it);
    } else {
      detail = '<div class="ext"><button data-expand="' + id + '">' + esc(t("intro")) + "</button>" +
        '<a href="' + esc(links.bangumi) + '" target="_blank" rel="noreferrer">Bangumi ↗</a>' +
        '<a href="' + esc(links.anilist) + '" target="_blank" rel="noreferrer">AniList ↗</a>' +
        '<a href="' + esc(links.mal) + '" target="_blank" rel="noreferrer">MyAnimeList ↗</a>' +
        "</div>" + platformRow(it);
    }

    return '<div class="card"><div class="row">' +
      (it.cover ? '<img class="cover" src="' + esc(it.cover) + '" alt="" loading="lazy">' : "") +
      '<div class="main">' +
      '<p class="tt">' + esc(dt.main) +
      (dt.sub ? ' <span style="font-size:12px;color:var(--sub);font-weight:400">' + esc(dt.sub) + "</span>" : "") +
      "</p>" +
      '<div class="tags">' + tags.join("") + "</div>" +
      '<p class="meta">' + metaHtml(it) + "</p>" +
      "</div>" +
      '<div class="acts">' +
      '<button class="fav' + (isFav ? " on" : "") + '" data-fav="' + esc(favKey) + '" type="button">' + (isFav ? "★" : "☆") + "</button>" +
      '<a href="' + esc(watchLink) + '" target="_blank" rel="noreferrer">' + esc(t("watch")) + " ↗</a>" +
      "</div></div>" + detail + "</div>";
  }

  // ==================== 事件 ====================
  var debounce = null;
  el.search.addEventListener("input", function () {
    clearTimeout(debounce);
    debounce = setTimeout(function () {
      state.query = el.search.value.trim();
      render();
    }, 200);
  });
  el.refreshBtn.onclick = function () { loadAll(); };
  el.setToggle.onclick = function () { state.showSettings = !state.showSettings; render(); };
  el.setProxy.addEventListener("change", function () {
    state.settings.proxy = el.setProxy.value.trim();
    saveSettings();
    // 代理变化后清掉官方简介缓存,重新拉取
    bgmMap = null;
    Object.keys(state.translated).forEach(function (k) {
      if (k.indexOf("bili|") === 0) delete state.translated[k];
    });
    if (state.settings.desc === "official") loadBgmCalendar();
    render();
  });
  el.favToggle.onclick = function () { state.onlyFav = !state.onlyFav; render(); };
  el.favExport.onclick = function () { exportFavs(); };
  el.favImport.onclick = function () { el.favFile.click(); };
  el.favFile.onchange = function () {
    if (el.favFile.files && el.favFile.files.length) importFavs(el.favFile.files[0]);
    el.favFile.value = "";
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  loadSettings();
  loadFavs();
  applyStaticText();
  updateFavBar();
  if (state.settings.desc === "official") loadBgmCalendar();
  loadAll();
})();
</script>
</body>
</html>
